[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rossmann-sales-forecast"
version = "0.1.0"
description = "Forecast 6 weeks of daily sales for 1,115 Rossmann stores (Kaggle)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "jupyterlab>=4.0",
    "pytest>=7.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "joblib>=1.3",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "tests*"]
